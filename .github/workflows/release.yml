name: Release

# Tags only. Keeping this out of desktop.yml means pull requests no longer show a
# skipped "Publish release" check.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    name: Desktop build
    uses: ./.github/workflows/build.yml
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: manga-reader-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l dist
          test "$(ls dist | wc -l)" -eq 2  # one zip per platform
          printf '%s\n' \
            'Portable build - unzip and run, no installation. A Java runtime is bundled,' \
            'so Java does not need to be installed separately.' \
            '' \
            'These builds are unsigned and macOS builds are not notarized:' \
            '' \
            '- Windows: SmartScreen warns on first launch. Choose More info, then Run anyway.' \
            '- macOS: Gatekeeper may report the app as damaged. Clear the quarantine flag:' \
            '  `xattr -dr com.apple.quarantine "Manga Reader.app"`' \
            > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Manga Reader ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            dist/*
