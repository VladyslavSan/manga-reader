name: Desktop

on:
  # No base-branch filter: a PR stacked on another branch needs checks too, and
  # filtering on [main] silently gave those PRs no checks at all.
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Desktop build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: windows-2025
            platform: windows-x64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Version resolution below needs tags and the commits since the last one.
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            # jpackage refuses a major version of 0 on macOS. Fail here with a clear
            # message rather than several minutes into packaging.
            refs/tags/v0|refs/tags/v0.*)
              echo "::error::Tag $GITHUB_REF_NAME has major version 0, which jpackage rejects on macOS. Tag v1.0.0 or later."
              exit 1 ;;
            refs/tags/v*)
              version="${GITHUB_REF_NAME#v}" ;;
            *)
              # Unpublished build: last release with its patch advanced by the number
              # of commits since that tag, so "1.2.5" reads as five commits past
              # v1.2.0. Before the first tag there is nothing to count from, so fall
              # back to the total commit count.
              last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
              if [ -n "$last" ]; then
                count=$(git rev-list "$last..HEAD" --count)
                IFS=. read -r major minor patch <<<"${last#v}"
                version="${major}.${minor:-0}.$(( ${patch:-0} + count ))"
              else
                version="1.0.$(git rev-list HEAD --count)"
              fi ;;
          esac
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Packaging version $version"
      # Version goes in as ORG_GRADLE_PROJECT_appVersion, not -PappVersion: on the
      # Windows runner the command-line form reached Gradle truncated at the first
      # dot ("1" instead of "1.0.2"), and configuring the Windows installer failed.
      - name: Test and package (macOS)
        if: runner.os == 'macOS'
        env:
          ORG_GRADLE_PROJECT_appVersion: ${{ env.APP_VERSION }}
        run: ./gradlew --no-daemon :composeApp:desktopTest :composeApp:createReleaseDistributable
      - name: Test and package (Windows)
        if: runner.os == 'Windows'
        env:
          ORG_GRADLE_PROJECT_appVersion: ${{ env.APP_VERSION }}
        run: .\gradlew.bat --no-daemon :composeApp:desktopTest :composeApp:createReleaseDistributable
      # Zip on the build runner, not after upload: upload-artifact drops the
      # executable bit and follows symlinks, which would break a macOS .app bundle.
      - name: Package portable app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          shopt -s nullglob
          apps=(composeApp/build/compose/binaries/main-release/app/*.app)
          [ ${#apps[@]} -eq 1 ] || { echo "::error::expected one .app, found ${#apps[@]}"; exit 1; }
          ditto -c -k --keepParent "${apps[0]}" "staging/manga-reader-${APP_VERSION}-${{ matrix.platform }}.zip"
          ls -l staging
      - name: Package portable app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          $app = @(Get-ChildItem 'composeApp\build\compose\binaries\main-release\app' -Directory)
          if ($app.Count -ne 1) { throw "expected one app directory, found $($app.Count)" }
          Compress-Archive -Path $app[0].FullName -DestinationPath "staging\manga-reader-$env:APP_VERSION-${{ matrix.platform }}.zip"
          Get-ChildItem staging
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.platform }}
          path: |
            composeApp/build/reports/tests/desktopTest/
            composeApp/build/test-results/desktopTest/
            composeApp/build/compose/logs/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manga-reader-${{ matrix.platform }}-${{ github.sha }}
          path: staging/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: manga-reader-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l dist
          test "$(ls dist | wc -l)" -eq 2  # one zip per platform
          printf '%s\n' \
            'Portable build - unzip and run, no installation. A Java runtime is bundled,' \
            'so Java does not need to be installed separately.' \
            '' \
            'These builds are unsigned and macOS builds are not notarized:' \
            '' \
            '- Windows: SmartScreen warns on first launch. Choose More info, then Run anyway.' \
            '- macOS: Gatekeeper may report the app as damaged. Clear the quarantine flag:' \
            '  `xattr -dr com.apple.quarantine "Manga Reader.app"`' \
            > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Manga Reader ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            dist/*
