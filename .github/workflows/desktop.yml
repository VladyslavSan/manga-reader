name: Desktop

on:
  # No base-branch filter: a PR stacked on another branch needs checks too, and
  # filtering on [main] silently gave those PRs no checks at all.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Desktop build
    uses: ./.github/workflows/build.yml
