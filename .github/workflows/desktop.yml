name: Desktop

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    name: Desktop build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: windows-2025
            platform: windows-x64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test and package (macOS)
        if: runner.os == 'macOS'
        run: ./gradlew --no-daemon -PappVersion=${{ env.APP_VERSION }} :composeApp:desktopTest :composeApp:packageDistributionForCurrentOS
      - name: Test and package (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon -PappVersion=${{ env.APP_VERSION }} :composeApp:desktopTest :composeApp:packageDistributionForCurrentOS
      - name: Stage installers
        shell: bash
        # upload-artifact roots an artifact at the least common ancestor of its files,
        # so uploading msi/ and exe/ direct from the build dir would nest them. Staging
        # flat keeps every artifact root-level, so the release job can glob dist/*.
        run: |
          set -euo pipefail
          mkdir -p staging
          cd composeApp/build/compose/binaries/main
          for f in dmg/*.dmg msi/*.msi exe/*.exe; do
            [ -e "$f" ] || continue
            mv "$f" "$GITHUB_WORKSPACE/staging/manga-reader-${APP_VERSION}-${{ matrix.platform }}.${f##*.}"
          done
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.platform }}
          path: |
            composeApp/build/reports/tests/desktopTest/
            composeApp/build/test-results/desktopTest/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload installers from main
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manga-reader-${{ matrix.platform }}-${{ github.sha }}
          path: staging/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: manga-reader-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(ls dist | wc -l)" -eq 3  # macOS dmg, plus msi + exe for Windows
          gh release create "v${APP_VERSION}" \
            --target "${{ github.sha }}" \
            --title "Manga Reader ${APP_VERSION}" \
            --notes 'Installers are unsigned and macOS builds are not notarized, so the OS will warn on first launch. A Java runtime is bundled.' \
            dist/*
